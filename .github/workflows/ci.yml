name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check extension syntax
        run: node --check extensions/dynamic-ss13-modules/extension.js
      - name: Validate package manifest
        run: python3 -m json.tool extensions/dynamic-ss13-modules/package.json >/tmp/dynamic-ss13-modules-package.json
